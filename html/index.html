<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Furniture Editor UI (New Rotate Controls)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght=300;400;600&display=swap');
        body { margin: 0; padding: 0; font-family: 'Kanit', sans-serif; overflow: hidden; display: none; user-select: none; }
        
        #editor-container { 
            position: absolute; 
            right: 3vw; 
            top: 12vh; 
            width: 330px; 
            color: #ffffff; 
            padding: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9), -1px -1px 0 rgba(0,0,0,0.8), 1px -1px 0 rgba(0,0,0,0.8), -1px 1px 0 rgba(0,0,0,0.8), 1px 1px 0 rgba(0,0,0,0.8);
        }
        
        .header { font-size: 18px; font-weight: 600; text-align: left; margin-bottom: 15px; color: #2ecc71; letter-spacing: 1px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 5px; padding-bottom: 3px; font-size: 14px; }
        .label { font-weight: 600; color: #ffffff; }
        .val { font-weight: 400; color: #2ecc71; }
        .val.frozen { color: #3498db; }
        
        .controls-list { margin-top: 20px; font-size: 13px; padding-top: 10px; border-top: 1px solid rgba(255, 255, 255, 0.2); }
        .controls-list div { margin-bottom: 6px; color: #dddddd; }
        kbd { background: rgba(0, 0, 0, 0.6); border: 1px solid #2ecc71; padding: 1px 5px; border-radius: 3px; font-weight: bold; font-family: monospace; color: #2ecc71; }
    </style>
</head>
<body>
    <div id="editor-container">
        <div class="header">FURNITURE EDITOR</div>
        <div class="row"><span class="label">Mode</span><span class="val" id="ui-mode">Position</span></div>
        <div class="row"><span class="label">Multiplier (Speed)</span><span class="val" id="ui-speed">0.1</span></div>
        <div class="row"><span class="label">X</span><span class="val" id="ui-x">0.00</span></div>
        <div class="row"><span class="label">Y</span><span class="val" id="ui-y">0.00</span></div>
        <div class="row"><span class="label">Z</span><span class="val" id="ui-z">0.00</span></div>
        <div class="row"><span class="label">Rot X</span><span class="val" id="ui-rx">0.00</span></div>
        <div class="row"><span class="label">Rot Y</span><span class="val" id="ui-ry">0.00</span></div>
        <div class="row"><span class="label">Rot Z</span><span class="val" id="ui-rz">0.00</span></div>
        <div class="row"><span class="label">Status</span><span class="val" id="ui-freeze">Active</span></div>

        <div class="controls-list">
            <div id="ctrl-main"></div>
            <div id="ctrl-sub"></div>
            <div><kbd>R</kbd> : Toggle Mode (No Attack)</div>
            <div><kbd>PgUp</kbd> <kbd>PgDn</kbd> : Speed (Min: 0.0001)</div>
            <div><kbd>/</kbd> : Speed Min/Max (Text Key)</div>
            <div><kbd>F</kbd> : Freeze Obj & Unlock Walk</div>
            <div><kbd>Enter</kbd> : Validate</div>
            <div><kbd>Delete</kbd> : Cancel</div>
        </div>
    </div>

    <script>
        window.addEventListener('message', function(event) {
            let data = event.data;
            if (data.action === "open") {
                document.body.style.display = "block";
            } else if (data.action === "close") {
                document.body.style.display = "none";
            } else if (data.action === "update") {
                document.getElementById('ui-mode').innerText = data.mode;
                document.getElementById('ui-speed').innerText = data.speed;
                document.getElementById('ui-x').innerText = data.x.toFixed(3);
                document.getElementById('ui-y').innerText = data.y.toFixed(3);
                document.getElementById('ui-z').innerText = data.z.toFixed(3);
                document.getElementById('ui-rx').innerText = data.rx.toFixed(3);
                document.getElementById('ui-ry').innerText = data.ry.toFixed(3);
                document.getElementById('ui-rz').innerText = data.rz.toFixed(3);
                
                let mainEl = document.getElementById('ctrl-main');
                let subEl = document.getElementById('ctrl-sub');
                
                // สลับข้อความอธิบายปุ่มให้ตรงตามโหมดแบบไดนามิก
                if (data.mode === "Position") {
                    mainEl.innerHTML = '<kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> : Move X / Y';
                    subEl.innerHTML = '<kbd>W</kbd> <kbd>S</kbd> : Move Z (Height)';
                } else {
                    mainEl.innerHTML = '<kbd>↑</kbd> <kbd>↓</kbd> : Local Rot X | <kbd>W</kbd> <kbd>S</kbd> : Local Rot Y';
                    subEl.innerHTML = '<kbd>←</kbd> <kbd>→</kbd> : Local Rot Z';
                }

                let freezeEl = document.getElementById('ui-freeze');
                if (data.freeze) {
                    freezeEl.innerText = "Frozen (Walk Allowed)";
                    freezeEl.className = "val frozen";
                } else {
                    freezeEl.innerText = "Active (Locked)";
                    freezeEl.className = "val";
                }
            }
        });
    </script>
</body>
</html>
